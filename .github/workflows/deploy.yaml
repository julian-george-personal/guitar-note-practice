name: S3 CI

on:
  push:
    branches: ["main"]
env:
  AWS_REGION: "us-east-1"
  SITE_NAME: "guitar-note-practice"
  LAMBDA_FUNCTION_NAME: "fretboarder"
  LAMBDA_BUCKET: "lambda-functions-juliangeorge"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build web
        run: npm run build
        env:
          VITE_FRETBOARDER_LAMBDA_URL: ${{ vars.VITE_FRETBOARDER_LAMBDA_URL }}
      - name: Upload web to S3
        run: aws s3 cp web/dist s3://static-sites-juliangeorge/${{ env.SITE_NAME }} --recursive
      - name: Build job
        run: npm run job:build
      - name: Package job
        run: cd job/dist && zip ../../${{ env.LAMBDA_FUNCTION_NAME }}.zip index.js
      - name: Upload job to S3
        run: aws s3 cp ${{ env.LAMBDA_FUNCTION_NAME }}.zip s3://${{ env.LAMBDA_BUCKET }}/${{ env.LAMBDA_FUNCTION_NAME }}.zip
      - name: Deploy job to Lambda
        run: aws lambda update-function-code --function-name ${{ env.LAMBDA_FUNCTION_NAME }} --s3-bucket ${{ env.LAMBDA_BUCKET }} --s3-key ${{ env.LAMBDA_FUNCTION_NAME }}.zip
